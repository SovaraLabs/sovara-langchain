name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: sovara-langchain
      - uses: astral-sh/setup-uv@v7
      - name: Test and lint
        working-directory: sovara-langchain/python
        run: |
          uv sync --frozen
          uv run pytest -q
          uv run ruff check .
          uv run ruff format --check .

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: sovara-langchain
      - uses: actions/setup-node@v5
        with:
          node-version: 24.22.1
      - name: Check
        working-directory: sovara-langchain/typescript
        run: npm ci && npm run check
